spring:
  flyway:
    # Older local databases can contain migrations from another feature branch.
    # Keep their history and continue validating migrations present in this branch.
    ignore-migration-patterns: '*:missing,*:future'
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.phongtro.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
